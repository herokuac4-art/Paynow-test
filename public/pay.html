<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout — Pay Now</title>
<style>
  *{box-sizing:border-box}
  :root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--muted:#6e6e73;--blue:#0071e3;--line:#ececf0}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,sans-serif;
    font-size:15px;-webkit-font-smoothing:antialiased;
  }
  .pay-card{width:100%;max-width:420px;background:var(--card);border-radius:24px;padding:32px;box-shadow:0 10px 50px rgba(0,0,0,.06);text-align:center}
  .pay-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
  .biz{font-size:13px;font-weight:600;color:var(--muted)}
  .timer{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--bg);padding:4px 12px;border-radius:999px;color:var(--muted)}
  h1{font-size:38px;margin:0;letter-spacing:-.03em;font-weight:600}
  .title{font-size:15px;font-weight:600;margin:6px 0 0}
  .desc{font-size:13px;color:var(--muted);margin:4px 0 0;min-height:18px}
  .qr{margin:26px auto 16px;width:196px;height:196px;border-radius:16px;overflow:hidden;background:var(--bg);display:grid;place-items:center}
  .qr img{width:100%;height:100%;display:block}
  .upi-id{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px;font-size:13px}
  .upi-id code{background:var(--bg);padding:6px 12px;border-radius:8px;font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
  .mini{border:0;background:transparent;color:var(--blue);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .intents{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
  .intent{
    display:flex;align-items:center;justify-content:center;height:46px;border-radius:12px;background:var(--bg);
    color:var(--ink);font-size:13px;font-weight:600;text-decoration:none;transition:transform .2s,background .2s;
  }
  .intent:hover{transform:translateY(-1px);background:#ededf0}
  .status{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:18px}
  .dot{width:8px;height:8px;border-radius:50%;background:#ff9500;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .demo{
    border:1px dashed #d8d8de;background:transparent;color:var(--muted);border-radius:12px;
    padding:11px 16px;font-size:12.5px;font-weight:600;cursor:pointer;width:100%;font-family:inherit;
  }
  .demo:hover{background:var(--bg);color:var(--ink)}
  .check{
    width:64px;height:64px;border-radius:50%;background:#e8f8ee;color:#1a7f37;font-size:30px;
    display:grid;place-items:center;margin:14px auto 18px;animation:pop .4s cubic-bezier(.4,0,.2,1);
  }
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  h2{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px;margin:0}
  .pay-foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.5}
  .demo-note{font-size:11.5px;color:#b26a00;background:#fff5e5;border-radius:10px;padding:8px 12px;margin-bottom:16px}
  .error{color:#c62828;font-size:14px}
</style>
</head>
<body>
<main class="pay-card" id="card">
  <div class="pay-head">
    <span class="biz" id="biz">Merchant</span>
    <span class="timer" id="timer">5:00</span>
  </div>
  <h1 id="amount">₹0</h1>
  <p class="title" id="title"></p>
  <p class="desc" id="desc"></p>

  <div id="stage-pay">
    <div class="demo-note" id="demo-note" hidden>Demo checkout — no real money moves.</div>
    <div class="qr"><img id="qr" alt="UPI QR code"></div>
    <div class="upi-id"><code id="vpa">—</code><button class="mini" id="copy-vpa" type="button">Copy</button></div>
    <div class="intents">
      <a class="intent" id="gpay">GPay</a>
      <a class="intent" id="phonepe">PhonePe</a>
      <a class="intent" id="paytm">Paytm</a>
    </div>
    <div class="status"><span class="dot"></span><span id="status-text">Waiting for payment…</span></div>
    <button class="demo" id="sim" type="button">Simulate payment (demo)</button>
  </div>

  <div id="stage-success" hidden>
    <div class="check">✓</div>
    <h2>Payment successful</h2>
    <p class="sub" id="success-sub"></p>
  </div>

  <footer class="pay-foot">
    Secured by Pay Now · Orchestrator only — funds settle directly via the connected gateway.
  </footer>
</main>

<script>
const $ = s => document.querySelector(s);
const money = p => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format((p || 0) / 100);
const slug = location.pathname.split('/').filter(Boolean).pop();

let orderId = null;
let es = null;
let timer = null;

async function jfetch(url, opts = {}) {
  const res = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...opts });
  let data = {};
  try { data = await res.json(); } catch { /* empty */ }
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

function fail(msg) {
  $('#stage-pay').hidden = true;
  $('#stage-success').hidden = true;
  $('#amount').textContent = '—';
  $('#title').innerHTML = '<span class="error">' + msg + '</span>';
  $('#desc').textContent = '';
  $('#timer').textContent = '';
}

function success(sub) {
  clearInterval(timer);
  if (es) { es.close(); es = null; }
  $('#stage-pay').hidden = true;
  $('#stage-success').hidden = false;
  $('#success-sub').textContent = sub || '';
  $('#timer').textContent = 'Paid';
}

function startTimer(expiresAt) {
  const el = $('#timer');
  const update = () => {
    const left = Math.max(0, expiresAt - Date.now());
    const m = Math.floor(left / 60000);
    const s = Math.floor((left % 60000) / 1000);
    el.textContent = m + ':' + String(s).padStart(2, '0');
    if (left <= 0) {
      clearInterval(timer);
      el.textContent = 'Expired';
      $('#status-text').textContent = 'This link has expired.';
      $('#sim').disabled = true;
    }
  };
  update();
  timer = setInterval(update, 1000);
}

function listen() {
  es = new EventSource(`/api/public/links/${slug}/events?orderId=${orderId}`);
  es.onmessage = ev => {
    try {
      const d = JSON.parse(ev.data);
      if (d.type === 'status' && d.orderId === orderId && d.status === 'success') {
        success('Order ' + orderId + ' · ' + money(link.amount));
      }
    } catch { /* ignore */ }
  };
  es.onerror = () => { /* EventSource auto-reconnects */ };
}

let link = null;

async function init() {
  try {
    link = await jfetch(`/api/public/links/${slug}`);
  } catch {
    return fail('This payment link is invalid or does not exist.');
  }

  $('#biz').textContent = link.businessName;
  $('#amount').textContent = money(link.amount);
  $('#title').textContent = link.productName;
  $('#desc').textContent = link.description || '';

  if (link.status === 'paid') return success('This link has already been paid.');
  if (link.status !== 'active') return fail('This payment link is no longer active.');

  startTimer(link.expiresAt);
  await createIntent();
}

async function createIntent() {
  try {
    const d = await jfetch(`/api/public/links/${slug}/intent`, { method: 'POST' });
    orderId = d.orderId;
    if (d.qr) $('#qr').src = d.qr;
    $('#vpa').textContent = d.vpa;
    $('#demo-note').hidden = !d.demo;

    $('#gpay').href = 'gpay://upi/pay?' + d.qs;
    $('#phonepe').href = 'phonepe://pay?' + d.qs;
    $('#paytm').href = 'paytmmp://upi/pay?' + d.qs;

    listen();
  } catch (e) {
    fail(e.message);
  }
}

$('#sim').addEventListener('click', async () => {
  if (!orderId) return;
  try {
    await jfetch(`/api/public/links/${slug}/simulate`, {
      method: 'POST',
      body: JSON.stringify({ orderId })
    });
  } catch (e) {
    $('#status-text').textContent = e.message;
  }
});

$('#copy-vpa').addEventListener('click', async () => {
  const v = $('#vpa').textContent;
  try { await navigator.clipboard.writeText(v); }
  catch {
    const ta = document.createElement('textarea');
    ta.value = v; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  $('#copy-vpa').textContent = 'Copied';
  setTimeout(() => { $('#copy-vpa').textContent = 'Copy'; }, 1500);
});

init();
</script>
</body>
</html>
